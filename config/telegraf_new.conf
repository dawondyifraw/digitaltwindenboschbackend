[agent]
  interval = "10s"
  flush_interval = "10s"
  debug = true
  quiet = false

# -------- Environmental Data --------
[[inputs.kafka_consumer]]
  name_override = "environmental_data"         # write to this measurement
  brokers = ["kafka:19092"]                    # or ["localhost:9092"] if Telegraf runs on host
  topics = ["environmental_data"]
  consumer_group = "telegraf-env"
  offset = "newest"
  data_format = "json"

  # JSON time
  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  json_timezone = "UTC"

  # Tags and fields
  tag_keys = ["sensor_id", "zone", "weather"]
  fieldpass = ["co2_ppm", "no2_ppb", "pm25_ugm3", "anomaly", "latitude", "longitude"]

# -------- Sound Pollution Data --------
[[inputs.kafka_consumer]]
  name_override = "sound_pollution_data"       # write to this measurement
  brokers = ["kafka:19092"]                    # or ["localhost:9092"]
  topics = ["sound_pollution_data"]
  consumer_group = "telegraf-sound"
  offset = "newest"
  data_format = "json"

  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  json_timezone = "UTC"

  tag_keys = ["sensor_id", "zone"]
  fieldpass = ["sound_db", "anomaly", "latitude", "longitude"]

# -------- InfluxDB v2 Output --------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "DenBosch"
  bucket = "sensordb_influx"

# (Optional) enforce numeric types if your JSON sometimes flips strings
[[processors.converter]]
   [processors.converter.fields]
     float = ["co2_ppm", "no2_ppb", "pm25_ugm3", "sound_db"]
     integer = ["anomaly"]
