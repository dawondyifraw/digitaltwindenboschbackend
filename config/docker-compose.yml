services:
  zookeeper:
    image: zookeeper:3.6
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - kafka_network

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - kafka_network
    healthcheck:
      test: nc -zv kafka 19092 || exit 1
      interval: 5s
      timeout: 10s
      retries: 5

  influxdb:
    image: influxdb:latest
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: DenBosch
      DOCKER_INFLUXDB_INIT_BUCKET: sensordb_influx
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - kafka_network

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    volumes:
      - ./config/telegraf.conf:/etc/telegraf/telegraf.conf
    environment:
      INFLUX_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka_network

  dashboard-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dashboard-api
    ports:
      - "5001:5001"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=DenBosch
      - BUCKET=sensors_db
    depends_on:
      - influxdb
    networks:
      - kafka_network
      - app_network

  llm-query-engine:
    build:
      context: .
      dockerfile: Dockerfile.llm
    container_name: llm-query-engine
    ports:
      - "5050:5050"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - HYPERBOLIC_API_KEY=${HYPERBOLIC_API_KEY}
    depends_on:
      - influxdb
    networks:
      - kafka_network
      - app_network

  kafka-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: kafka-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - kafka_network

  kafka-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: kafka-consumer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
    depends_on:
      - kafka
      - influxdb
    networks:
      - kafka_network

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app_network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      OLLAMA_API_BASE: "http://ollama:11434"
    restart: always
    depends_on:
      - ollama
    networks:
      - app_network

volumes:
  open-webui:
  ollama_data:
  influxdb-data:


networks:
  kafka_network:
    driver: bridge
  app_network:
    driver: bridge
